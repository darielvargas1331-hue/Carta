<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>Para ti ❤️</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Georgia, 'Times New Roman', serif;
            background: linear-gradient(135deg, #fff0f3, #ffe4e8);
            min-height: 100vh;
            overflow-x: hidden;
            color: #5a1725;
        }

        /* =========================
           🌹🌻 LLUVIA DE FLORES
        ========================== */

        .flores {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .flor {
            position: absolute;
            top: -80px;
            animation: caer linear infinite;
            user-select: none;
        }

        .girasol {
            font-size: 35px;
        }

        .rosa {
            font-size: 32px;
        }

        @keyframes caer {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Diferentes posiciones y velocidades */

        .flor:nth-child(1) {
            left: 5%;
            animation-duration: 7s;
        }

        .flor:nth-child(2) {
            left: 15%;
            animation-duration: 10s;
        }

        .flor:nth-child(3) {
            left: 25%;
            animation-duration: 8s;
        }

        .flor:nth-child(4) {
            left: 35%;
            animation-duration: 12s;
        }

        .flor:nth-child(5) {
            left: 45%;
            animation-duration: 9s;
        }

        .flor:nth-child(6) {
            left: 55%;
            animation-duration: 11s;
        }

        .flor:nth-child(7) {
            left: 65%;
            animation-duration: 8s;
        }

        .flor:nth-child(8) {
            left: 75%;
            animation-duration: 10s;
        }

        .flor:nth-child(9) {
            left: 85%;
            animation-duration: 7s;
        }

        .flor:nth-child(10) {
            left: 95%;
            animation-duration: 12s;
        }

        /* =========================
           ❤️ CONTENIDO PRINCIPAL
        ========================== */

        .contenido {
            position: relative;
            z-index: 2;
            max-width: 1000px;
            margin: auto;
            padding: 50px 20px;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .subtitulo {
            font-size: 20px;
            margin-bottom: 40px;
        }

        /* =========================
           💌 CARTA
        ========================== */

        .carta {
            background: rgba(255, 255, 255, 0.9);
            max-width: 700px;
            margin: 0 auto 50px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(100, 20, 30, 0.2);
        }

        .carta h2 {
            margin-bottom: 20px;
        }

        .carta p {
            line-height: 1.8;
            font-size: 18px;
        }

        /* =========================
           📸 GALERÍA
        ========================== */

        .galeria-container {
            margin-top: 40px;
        }

        .galeria-container h2 {
            margin-bottom: 25px;
            font-size: 30px;
        }

        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 18px;
        }

        .foto {
            background: white;
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 7px 20px rgba(100, 20, 30, 0.18);
            transition: transform 0.3s ease;
        }

        .foto:hover {
            transform: scale(1.04);
        }

        .foto img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            border-radius: 10px;
            display: block;
        }

        .foto p {
            padding: 10px 5px 5px;
            font-weight: bold;
        }

        /* =========================
           🎵 MÚSICA
        ========================== */

        .musica {
            margin-top: 50px;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(100, 20, 30, 0.15);
        }

        .musica h2 {
            margin-bottom: 20px;
        }

        audio {
            width: 100%;
            max-width: 500px;
        }

        /* =========================
           📱 CELULARES
        ========================== */

        @media (max-width: 600px) {

            .contenido {
                padding: 35px 15px;
            }

            h1 {
                font-size: 32px;
            }

            .subtitulo {
                font-size: 17px;
            }

            .carta {
                padding: 25px 20px;
            }

            .carta p {
                font-size: 16px;
            }

            .foto img {
                height: 200px;
            }
        }
    </style>
</head>
